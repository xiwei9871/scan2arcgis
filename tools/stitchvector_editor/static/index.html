<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>StitchVector Editor V0.1</title>
<style>
  body { margin: 0; font: 13px -apple-system, sans-serif; display: flex; height: 100vh; }
  #side { width: 300px; padding: 8px; overflow-y: auto; border-right: 1px solid #ccc; background: #fafafa; }
  #main { flex: 1; position: relative; overflow: hidden; background: #888; }
  #cv { position: absolute; left: 0; top: 0; cursor: crosshair; }
  h3 { margin: 10px 0 4px; font-size: 13px; }
  button { margin: 2px 1px; font-size: 12px; }
  button.on { background: #0059c1; color: #fff; }
  .row { margin: 3px 0; }
  #sel, #log { font: 11px ui-monospace, monospace; white-space: pre-wrap; background: #fff; border: 1px solid #ddd; padding: 4px; max-height: 180px; overflow-y: auto; }
  #msg { color: #b00; min-height: 16px; }
  #dirty { color: #c60; font-weight: bold; }
  .sw { display: inline-block; width: 14px; height: 14px; border: 1px solid #333; vertical-align: middle; }
</style>
</head>
<body>
<div id="side">
  <b>StitchVector Editor V0.1</b> <span id="dirty"></span>
  <div id="src" style="font-size:11px;color:#555"></div>

  <h3>显示</h3>
  <div class="row"><label><input type="checkbox" id="showImg" checked> 原图</label>
    <label><input type="checkbox" id="showFaces" checked> 面层</label>
    <label><input type="checkbox" id="showLines" checked> 线层</label></div>
  <div class="row">面层透明度 <input type="range" id="alpha" min="0" max="100" value="45" style="width:120px"></div>
  <div class="row"><button id="fit">适应窗口</button> 滚轮缩放，右键或空格拖动平移</div>

  <h3>工具</h3>
  <div class="row">
    <button data-tool="pickFace" class="on">选面</button>
    <button data-tool="pickLine">选线</button>
    <button data-tool="boxFace">框选面</button>
    <button data-tool="eyedrop">吸管</button>
    <button data-tool="split">拆分线</button>
    <button data-tool="draw">补画线</button>
  </div>
  <div class="row">Shift 加选。补画：逐点单击，双击结束。</div>

  <h3>选择</h3>
  <div class="row"><button id="group">选整组线 (logical_id)</button> <button id="grow">扩展相邻同色面</button> <button id="clear">清除</button></div>
  <div id="sel">（无）</div>

  <h3>编辑</h3>
  <div class="row">颜色 <input type="color" id="colour" value="#ff0000"> <span id="pickedSw" class="sw"></span>
    <button id="apply">应用颜色</button></div>
  <div class="row">线宽 <input type="number" id="width" value="2" step="0.5" min="0.25" style="width:60px"> <button id="rewidth">应用线宽</button></div>
  <div class="row"><button id="merge">合并所选面</button> <button id="del">删除所选线</button> <button id="regroup">所选线设为新组</button></div>
  <div class="row"><button id="l2f">线转面（实验）</button></div>
  <div class="row"><button id="undo">撤销 ⌘Z</button> <button id="redo">重做 ⇧⌘Z</button></div>

  <h3>保存</h3>
  <div class="row"><input id="fname" value="edited.gpkg" style="width:150px"> <button id="save">另存为新 GPKG</button></div>
  <div id="msg"></div>
  <h3>修改记录</h3>
  <div id="log"></div>
</div>
<div id="main"><canvas id="cv"></canvas></div>
<script src="/app.js"></script>
</body>
</html>
