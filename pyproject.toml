[project]
name = "scan2arcgis"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.23.0"]

[project.optional-dependencies]
dev = ["pytest==7.4.3"]
r1 = ["numpy==1.24.3", "opencv-contrib-python-headless==4.10.0.84", "scipy==1.15.3", "scikit-learn==1.7.2",
      "scikit-image==0.24.0", "shapely==2.0.2", "rasterio==1.4.4", "geopandas==1.1.4", "pyogrio==0.13.0",
      "onnxruntime==1.23.2", "pillow==10.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
